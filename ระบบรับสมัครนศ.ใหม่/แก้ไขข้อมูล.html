<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แก้ไขข้อมูล</title>
    <link rel="stylesheet" href="./css/grid.css">
    <style>
        .form-wrapper {
            display: flex;
            justify-content: center;
            padding: 30px 20px;
        }

        .form-box {
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            padding: 35px 40px;
            width: 100%;
            max-width: 750px;
        }

        .form-box h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #003366;
        }

        .form-field {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-field label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.95rem;
            font-weight: bold;
            color: #333333;
        }

        .form-field input,
        .form-field select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            background: #ffffff;
        }

        .form-field input[type="file"] {
            border: 1px dashed #A6323C;
            background: #fff8f8;
            padding: 10px;
        }

        .upload-note {
            display: block;
            font-size: 0.8rem;
            color: #888888;
            margin-bottom: 8px;
            font-weight: normal;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-field {
            flex: 1;
        }

        .form-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
        }

        .form-buttons a,
        .form-buttons button {
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: bold;
            border: none;
            font-size: 1rem;
            cursor: pointer;
        }

        .btn-back {
            background-color: #e0e0e0;
            color: #333333;
        }

        .btn-back:hover {
            background-color: #cccccc;
        }

        .btn-next {
            background-color: #ffe45d;
            color: #030776;
        }

        .btn-next:hover {
            background-color: #003366;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="grid">
        <header class="item item-header">มหาวิทยาลัยเทคโนโลยีพระจอมเกล้าพระนครเหนือ วิทยาเขตปราจีนบุรี</header>
    <nav class="item item-menu">
        <a href="./index.html">หน้าแรก</a>
        <a href="./ขั้นตอนการสมัคร.html">ขั้นตอนการสมัคร</a>
        <a href="./ติดต่อเรา.html">ติดต่อเรา</a>
    </nav>
    <div class="item item-logo">
        <img src="./immage/logo_kmutnb-(6).png" alt="logo">
    </div>

    <div class="form-wrapper">
        <div class="form-box">
            <h2>แก้ไขข้อมูล</h2>
            <form id="personalInfoForm" action="./แก้ไขข้อมูลเอกสาร.html" method="get" enctype="multipart/form-data">
                <div class="form-row">
                    <div class="form-field" style="flex:0.6;">
                        <label for="title">คำนำหน้า</label>
                        <select id="title" name="title" required>
                            <option value="">เลือก</option>
                            <option value="นาย" selected>นาย</option>
                            <option value="นางสาว">นางสาว</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label for="firstname">ชื่อ</label>
                        <input type="text" id="firstname" name="firstname" value="xxxxxx" required>
                    </div>
                    <div class="form-field">
                        <label for="lastname">นามสกุล</label>
                        <input type="text" id="lastname" name="lastname" value="xxxxxx" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-field">
                        <label for="nickname">ชื่อเล่น</label>
                        <input type="text" id="nickname" name="nickname" value="xxxxxx">
                    </div>
                    <div class="form-field">
                        <label for="gender">เพศ</label>
                        <select id="gender" name="gender" required>
                            <option value="">เลือก</option>
                            <option value="ชาย" selected>ชาย</option>
                            <option value="หญิง">หญิง</option>
                            <option value="อื่นๆ">อื่นๆ</option>
                        </select>
                    </div>
                </div>

                <div class="form-field">
                    <label for="idcard">เลขบัตรประจำตัวประชาชน</label>
                    <input
                        type="text"
                        id="idcard"
                        name="idcard"
                        maxlength="13"
                        inputmode="numeric"
                        pattern="[0-9]{13}"
                        value="xxxxxxxxxxxxx"
                        required
                    >
                </div>

                <div class="form-row">
                    <div class="form-field">
                        <label for="birthdate">วันเกิด</label>
                        <input type="date" id="birthdate" name="birthdate" required>
                    </div>
                    <div class="form-field">
                        <label for="nationality">สัญชาติ</label>
                        <input type="text" id="nationality" name="nationality" value="ไทย" required>
                    </div>
                    <div class="form-field">
                        <label for="religion">ศาสนา</label>
                        <input type="text" id="religion" name="religion" value="พุทธ">
                    </div>
                </div>

                <div class="form-field">
                    <label for="address">ที่อยู่ตามทะเบียนบ้าน</label>
                    <input type="text" id="address" name="address" value="xxxxxxxxxxxxxxxxxxxx" required>
                </div>

                <div class="form-row">
                    <div class="form-field">
                        <label for="district">ตำบล/แขวง</label>
                        <input type="text" id="district" name="district" value="xxxxxx" required>
                    </div>
                    <div class="form-field">
                        <label for="amphoe">อำเภอ/เขต</label>
                        <input type="text" id="amphoe" name="amphoe" value="xxxxxx" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-field">
                        <label for="province">จังหวัด</label>
                        <input type="text" id="province" name="province" value="xxxxxx" required>
                    </div>
                    <div class="form-field">
                        <label for="zipcode">รหัสไปรษณีย์</label>
                        <input
                            type="text"
                            id="zipcode"
                            name="zipcode"
                            maxlength="5"
                            inputmode="numeric"
                            pattern="[0-9]{5}"
                            value="xxxxx"
                            required
                        >
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-field">
                        <label for="phone">เบอร์โทรศัพท์</label>
                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            maxlength="10"
                            inputmode="numeric"
                            pattern="[0-9]{9,10}"
                            value="xxxxxxxxxx"
                            required
                        >
                    </div>
                    <div class="form-field">
                        <label for="email">อีเมล</label>
                        <input type="email" id="email" name="email" value="xxxxxxxxxx@xxxxx.com" required>
                    </div>
                </div>

                <div class="form-field">
                    <label for="lineid">Line ID</label>
                    <input type="text" id="lineid" name="lineid" value="xxxxxx">
                </div>

                <div class="form-field">
                    <label for="school">โรงเรียนที่จบมา</label>
                    <input type="text" id="school" name="school" value="โรงเรียนxxxxxxxxxx" required>
                </div>

                <div class="form-row">
                    <div class="form-field">
                        <label for="schoolProvince">จังหวัดของโรงเรียน</label>
                        <input type="text" id="schoolProvince" name="schoolProvince" value="xxxxxx" required>
                    </div>
                    <div class="form-field">
                        <label for="studyplan">แผนการเรียน</label>
                        <input type="text" id="studyplan" name="studyplan" value="วิทย์-คณิต">
                    </div>
                    <div class="form-field">
                        <label for="gpa">เกรดเฉลี่ย</label>
                        <input
                            type="text"
                            id="gpa"
                            name="gpa"
                            inputmode="decimal"
                            pattern="[0-4](\.[0-9]{1,2})?"
                            value="x.xx"
                            required
                        >
                    </div>
                </div>

                <hr style="margin: 25px 0; border: none; border-top: 1px solid #eee;">
                <h3 style="margin-bottom: 15px; color: #003366; font-size: 1.05rem;">คณะและสาขาที่ต้องการสมัคร</h3>

                <div class="form-field">
                    <label for="faculty">คณะที่ต้องการสมัคร</label>
                    <select id="faculty" name="faculty" required>
                        <option value="">เลือกคณะ</option>
                        <option value="FITM" selected>คณะเทคโนโลยีและการจัดการอุตสาหกรรม (FITM)</option>
                        <option value="BAS">คณะบริหารธุรกิจและอุตสาหกรรมบริการ (BAS)</option>
                        <option value="AGRO">คณะอุตสาหกรรมเกษตรดิจิทัล</option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="major">สาขาที่ต้องการสมัคร</label>
                    <select id="major" name="major" required>
                        <option value="">เลือกสาขา</option>
                        <optgroup label="คณะเทคโนโลยีและการจัดการอุตสาหกรรม (FITM)">
                            <option value="IT">เทคโนโลยีสารสนเทศ (IT)</option>
                            <option value="DC">การออกแบบและการจัดการโครงการก่อสร้างดิจิทัล (DC)</option>
                            <option value="MM">เทคโนโลยีเครื่องกลและกระบวนการผลิต (MM)</option>
                            <option value="IEM">วิศวกรรมอุตสาหการและการจัดการโลจิสติกส์ (IEM)</option>
                            <option value="AFE">วิศวกรรมเกษตรและการอาหาร (AFE)</option>
                            <option value="INE" selected>วิศวกรรมสารสนเทศและเครือข่าย (INE)</option>
                        </optgroup>
                        <optgroup label="คณะบริหารธุรกิจและอุตสาหกรรมบริการ (BAS)">
                            <option value="THT">การจัดการอุตสาหกรรมท่องเที่ยวและโรงแรม (TH/THT)</option>
                            <option value="IBT">บริหารธุรกิจอุตสาหกรรมและการค้า (IBT/IBTT)</option>
                        </optgroup>
                        <optgroup label="คณะอุตสาหกรรมเกษตรดิจิทัล">
                            <option value="IPD">นวัตกรรมและเทคโนโลยีการพัฒนาผลิตภัณฑ์ (IPD)</option>
                            <option value="FSN">วิทยาศาสตร์การอาหารและโภชนาการ (FSN)</option>
                            <option value="FSM">วิทยาศาสตร์การอาหารและการจัดการ (FSM)</option>
                        </optgroup>
                    </select>
                </div>

                <div class="form-buttons">
                    <a href="./ข้อมูลการสมัครของฉัน.html" class="btn-back">ย้อนกลับ</a>
                    <button type="submit" class="btn-next"><a href="./แก้ไขข้อมูลไฟล์.html">แก้ไขข้อมูลไฟล์เอกสาร</a></button>
                </div>
            </form>
        </div>
    </div>

    <footer class="item item-footer"><a href="https://l.facebook.com/l.php?u=https%3A%2F%2Fwww.kmutnb.ac.th%2Ffaculty-and-agencies%2Fprachin-campus.aspx%3Ffbclid%3DIwcGRvZgVleHRuA2FlbQIxMABicmlkETFYWXphRTQ4S00xTk5UT1pRc3J0YwZhcHBfaWQQMjIyMDM5MTc4ODIwMDg5MgABHsIOeJzZkfWWwvNygyeZ1esvUipdM-WHYrgIwE5UDQOzFPaUgATMLIM5cCkx_aem_eY9rqIrSB7QNKpOEVMj6SA&h=AUBbkbvCUi55y59-kZc2TKRIU2HmcZs7ALTGXBsm-K4JSbqLB4-RGOZ2unKpYDqMYZBDcbNJzSlnH-m28MnSYnNid7P4mkWFqxNDB8fFLsglH3Jii6kutWQjYGY0qLs" target="_blank">แหล่งอ้างอิง: มหาวิทยาลัยเทคโนโลยีพระจอมเกล้าพระนครเหนือ วิทยาเขตปราจีนบุรี (มจพ.ปราจีนบุรี)</a>
    </footer>
        </div>

</body>
</html>
