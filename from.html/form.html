<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="./stry/stry.css">
</head>
<body>
    <div class="from" >
          <form >
                 <h1>การรับสมัครนักศึกษาใหม่</h1>
                 <label for="name">ชื่อ-นามสกุล:</label><br>
                       <input type="text" id="name" name="name"><br>
                 <label for="email">กรุณากรอกอีเมลของคุณ:</label><br>
                       <input type="email" id="email" name="email"><br>
                 <label for="อายุ">อายุของคุณ:</label>
                       <input type="number" id="อายุ" name="อายุ" min="10" max="100"><br>
                 <label for="น้ำหนัก">น้ำหนัก:</label>
                       <input type="number" id="น้ำหนัก" name="น้ำหนัก" min="20" max="200"><br>
                 <label for="ส่วนสูง">ส่วนสูง:</label>
                       <input type="number" id="ส่วนสูง" name="ส่วนสูง" min="100" max="250"><br>
                  <label for="เพศ">เพศ</label><br>
                       <input type="radio" id="ชาย" name="เพศ" value="ชาย">
                  <label for="เพศ">ชาย</label><br>
                       <input type="radio" id="หญิง" name="เพศ" value="หญิง">
                  <label for="เพศ">หญิง</label><br>
                       <input type="radio" id="ไม่ระบุ" name="เพศ" value="ไม่ระบุ">
                  <label for="เพศ">ไม่ระบุ</label><br>
                  <label for="วันเกิด">กรุณากรอกวันเกิดของคุณ:</label><br>
                       <input type="date" id="วันเกิด" name="วันเกิด"><br>
                  <label for="เกรด">เกรดเฉลี่ย5เทอม:</label><br>
                       <input type="number" id="เกรด" name="เกรด" min="0" max="4" step="0.01"><br>
                  <label for="school">สถาณศึกษาที่คุณจบ:</label><br>
                       <input type="text" id="school" name="school"><br>
                    <label for="สาขาวิชา">สาขาวิชาที่คุณสนใจ:</label><br>
                       <input type="radio" id="INE" name="สาขาวิชา" value="INE">
                  <label for="สาขาวิชา">INE</label><br>
                       <input type="radio" id="INET" name="สาขาวิชา" value="INET">
                  <label for="สาขาวิชา">INET</label><br>
                       <input type="radio" id="IT" name="สาขาวิชา" value="IT">
                  <label for="สาขาวิชา">IT</label><br>
                       <input type="radio" id="ITT" name="สาขาวิชา" value="ITT">
                  <label for="สาขาวิชา">ITT</label><br>   
                    <input type="radio" id="ITI" name="สาขาวิชา" value="ITI">
                  <label for="สาขาวิชา">ITI</label><br>
                  <label for="piger">ใส่ภาพรูปหน้าคุณ:</label><br>
                      <input type="file" id="piger" name="piger"><br><br>
                      <input type="submit" value="Submit">
                      <input type="reset" value="Reset">
          </form>







    </div>
    
</body>
</html>
