<!-- form -->
   
   
         <form  class="item item-form" action="">
             <h4>สมัครสมาชิก</h4>
            <label for="ชื่อ">ชื่อ</label><br>
            <input type="text" id="ชื่อ" name="ชื่อ" placeholder="ชื่อจริง"><br>
            <label for="นามสกุล">นามสกุล</label><br>
            <input type="text" id="นามสกุล" name="นามสกุล" placeholder="นามสกุล"><br>
                <label for="อีเมล">อีเมล</label><br>
                <input type="email" id="อีเมล" name="อีเมล" pattern=".+domain\.com" placeholder="example@domain.com"><br>
                <label for="รหัสผ่าน">รหัสผ่าน</label><br>
                <input type="password" id="รหัสผ่าน" name="รหัสผ่าน" placeholder="รหัสผ่าน" minlength="8" required><br>
                <label for="ยืนยันรหัสผ่าน">ยืนยันรหัสผ่าน</label><br>
                <input type="password" id="ยืนยันรหัสผ่าน" name="ยืนยันรหัสผ่าน" placeholder="ยืนยันรหัสผ่าน" minlength="8" oninput="this.setCustomValidity(this.value != document.getElementById('รหัสผ่าน') .value ? 'รหัสผ่านไม่ครงกัน' : '')" required><br>
                <label for="เบอร์โทรศัพท์">เบอร์โทรศัพท์</label><br>
                <input type="tel" id="เบอร์โทรศัพท์" name="เบอร์โทรศัพท์" placeholder="083-xxx-xxxx" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"><br>
                <label for="เพศ">เพศ</label><br>
                <label></label><input type="radio" id="ชาย" name="เพศ" value="ชาย">ชาย</label>
                
              <label></label><input type="radio" id="หญิง" name="เพศ" value="หญิง">หญิง</label>
               <label></label><input type="radio" id="ไม่ระบุ" name="เพศ" value="ไม่ระบุ">ไม่ระบุ</label>
               <label></label><input type="checkbox" id="รับข่าวสาร" name="รับข่าวสาร" value="รับข่าวสาร">รับข่าวสาร</label>
               <label> <input type="checkbox" id="โปรโมชั่น" name="โปรโมชั่น" value="โปรโมชั่น">โปรโมชั่น</label>
                
                <label><input type="checkbox" id="กิจกรรม" name="กิจกรรม" value="กิจกรรม">กิจกรรม</label><br>
                
                <label for="ประเภทสมาชิก">ประเภทสมาชิก</label><br>
                <select name="ประเภทสมาชิก" id="ประเภทสมาชิก">
                    <option value="ธรรมดา">ธรรมดา</option>
                    <option value="พิเศษ">พิเศษ</option>
                </select><br>
            
                <label ><input type="checkbox" id="ยอมรับข้อกำหนด" name="ยอมรับข้อกำหนด" value="ยอมรับข้อกำหนดและเงื่อนไข">ยอมรับข้อกำหนดและเงื่อนไข</label><br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      
                <input type="submit" value="สมัครสมาชิก">


        </form>
        
        <footer class="item item-footer"><img src="./images/footer.jpg" alt="footer"></footer>
        </div>
